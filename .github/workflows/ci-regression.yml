name: CUDAForge Performance Regression & Integration CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance-regression:
    name: GPU Benchmark Regression Suite
    runs-on: [self-hosted, GPU, sm_86] # Target NVIDIA GPU Runner
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Build Dependencies & PyTorch
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install torch --index-url https://download.pytorch.org/whl/cu121
          pip install ninja cmake pytest ruff mypy

      - name: Verify CUDA Environment
        run: |
          nvidia-smi
          python3 -c "import torch; print('CUDA Available:', torch.cuda.is_available()); print('Device:', torch.cuda.get_device_name(0))"

      - name: Build C++/CUDA Extensions
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_CUDA_ARCHITECTURES=86
          make -j$(nproc)
          cd ..
          pip install -e . --no-build-isolation

      - name: Execute Automated Regression Runner
        env:
          PYTHONPATH: .
        run: |
          python3 benchmarks/regression_runner.py

      - name: Upload Benchmark Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-regression-results
          path: |
            benchmarks/baselines/baseline_metrics.json